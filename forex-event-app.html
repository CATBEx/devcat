<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Signal Hub</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const theme = {
        bg: "#080B12",
        bgCard: "#0E1420",
        bgCardHover: "#131926",
        bgGlass: "rgba(14,20,32,0.85)",
        border: "rgba(255,255,255,0.06)",
        borderStrong: "rgba(255,255,255,0.12)",
        accent: "#00E5A0",
        accentDim: "rgba(0,229,160,0.12)",
        red: "#FF3B6B",
        redDim: "rgba(255,59,107,0.12)",
        yellow: "#FFB800",
        yellowDim: "rgba(255,184,0,0.12)",
        blue: "#3B8BFF",
        blueDim: "rgba(59,139,255,0.12)",
        text: "#F0F4FF",
        textSub: "#6B7A99",
        textMuted: "#3D4A63",
        gold: "#FFD166",
      };

      const css = `
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: ${theme.bg};
            font-family: 'DM Sans', sans-serif;
            color: ${theme.text};
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        ::-webkit-scrollbar { width: 0; }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slide-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes scan-line {
            0% { top: 0; opacity: 0.6; }
            100% { top: 100%; opacity: 0; }
        }

        @keyframes glow-pulse {
            0%, 100% { box-shadow: 0 0 12px rgba(0,229,160,0.3); }
            50% { box-shadow: 0 0 24px rgba(0,229,160,0.6); }
        }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes bar-grow {
            from { width: 0; }
            to { width: var(--target-width); }
        }

        .card-enter { animation: slide-up 0.35s ease forwards; }
        .card-enter:nth-child(2) { animation-delay: 0.05s; opacity: 0; }
        .card-enter:nth-child(3) { animation-delay: 0.10s; opacity: 0; }
        .card-enter:nth-child(4) { animation-delay: 0.15s; opacity: 0; }
        .card-enter:nth-child(5) { animation-delay: 0.20s; opacity: 0; }

        .tab-active-indicator {
            background: linear-gradient(90deg, transparent, ${theme.accent}, transparent);
            animation: none;
        }

        .mono { font-family: 'DM Mono', monospace; }
        .syne { font-family: 'Syne', sans-serif; }

        button { cursor: pointer; border: none; outline: none; background: none; }

        .shimmer-card {
            background: linear-gradient(90deg, ${theme.bgCard} 25%, #141D2E 50%, ${theme.bgCard} 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        `;

      // ── Data ──────────────────────────────────────────────────────────────────────

      const upcomingData = [
        { id: 1, pair: "EURUSD", tf: "M15", pattern: "Shooting Star", strength: 74, dir: "SELL", age: "0:32" },
        { id: 2, pair: "BTCUSDT", tf: "H1", pattern: "Doji Indecision", strength: 51, dir: "NEUTRAL", age: "1:14" },
        { id: 3, pair: "GBPJPY", tf: "H4", pattern: "Bullish Engulfing", strength: 88, dir: "BUY", age: "2:07" },
        { id: 4, pair: "ETHUSDT", tf: "M5", pattern: "Hammer", strength: 63, dir: "BUY", age: "3:55" },
        { id: 5, pair: "XAUUSD", tf: "H1", pattern: "Evening Star", strength: 41, dir: "SELL", age: "5:20" },
      ];

      const recentData = [
        { id: 6, pair: "USDJPY", tf: "H4", pattern: "Morning Star", confidence: 89, dir: "BUY", ago: "4m ago" },
        { id: 7, pair: "SOLUSDT", tf: "M15", pattern: "Bearish Engulfing", confidence: 72, dir: "SELL", ago: "11m ago" },
        { id: 8, pair: "EURUSD", tf: "H1", pattern: "Tweezer Bottom", confidence: 81, dir: "BUY", ago: "23m ago" },
        { id: 9, pair: "BNBUSDT", tf: "M5", pattern: "Shooting Star", confidence: 66, dir: "SELL", ago: "38m ago" },
        { id: 10, pair: "GBPUSD", tf: "H4", pattern: "Bullish Harami", confidence: 77, dir: "BUY", ago: "1h ago" },
      ];

      const notificationsData = [
        { id: 1, pair: "EURUSD", tf: "M5", event: "Shooting Star forming", time: "2m ago", read: false, dir: "SELL" },
        { id: 2, pair: "BTCUSDT", tf: "H1", event: "Bullish Engulfing confirmed", time: "9m ago", read: false, dir: "BUY" },
        { id: 3, pair: "XAUUSD", tf: "H4", event: "Evening Star forming", time: "18m ago", read: true, dir: "SELL" },
        { id: 4, pair: "GBPJPY", tf: "M15", event: "Hammer confirmed", time: "34m ago", read: true, dir: "BUY" },
        { id: 5, pair: "ETHUSDT", tf: "H1", event: "Doji — Watch closely", time: "1h ago", read: true, dir: "NEUTRAL" },
      ];

      // ── Icons ─────────────────────────────────────────────────────────────────────

      const Icon = ({ name, size = 20, color = "currentColor" }) => {
        const paths = {
          calendar: (
            <>
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </>
          ),
          clock: (
            <>
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </>
          ),
          wallet: (
            <>
              <rect x="2" y="5" width="20" height="14" rx="2" />
              <line x1="2" y1="10" x2="22" y2="10" />
              <circle cx="17" cy="15" r="1.5" fill={color} />
            </>
          ),
          bell: (
            <>
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </>
          ),
          user: (
            <>
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </>
          ),
          lock: (
            <>
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </>
          ),
          chevronRight: <polyline points="9 18 15 12 9 6" />,
          arrowUp: (
            <>
              <line x1="12" y1="19" x2="12" y2="5" />
              <polyline points="5 12 12 5 19 12" />
            </>
          ),
          arrowDown: (
            <>
              <line x1="12" y1="5" x2="12" y2="19" />
              <polyline points="19 12 12 19 5 12" />
            </>
          ),
          star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />,
          creditCard: (
            <>
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2" />
              <line x1="1" y1="10" x2="23" y2="10" />
            </>
          ),
          settings: (
            <>
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </>
          ),
          check: <polyline points="20 6 9 17 4 12" />,
          zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />,
          trendUp: (
            <>
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
              <polyline points="17 6 23 6 23 12" />
            </>
          ),
          shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />,
        };
        return (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
            {paths[name]}
          </svg>
        );
      };

      // ── Ticker ────────────────────────────────────────────────────────────────────

      const TickerBar = () => {
        const items = ["EURUSD +0.12%", "BTCUSDT +2.34%", "XAUUSD -0.08%", "GBPJPY +0.45%", "ETHUSDT +3.17%", "USDJPY -0.22%", "SOLUSDT +5.89%", "BNBUSDT +1.03%"];
        const doubled = [...items, ...items];
        return (
          <div style={{ background: "rgba(0,229,160,0.04)", borderBottom: `1px solid ${theme.border}`, overflow: "hidden", height: 32, display: "flex", alignItems: "center" }}>
            <div style={{ display: "flex", gap: 32, animation: "ticker 22s linear infinite", whiteSpace: "nowrap" }}>
              {doubled.map((item, i) => {
                const up = item.includes("+");
                return (
                  <span key={i} className="mono" style={{ fontSize: 10, color: up ? theme.accent : theme.red, letterSpacing: "0.04em", fontWeight: 500 }}>
                    {item}
                  </span>
                );
              })}
            </div>
          </div>
        );
      };

      // ── Signal Direction Chip ─────────────────────────────────────────────────────

      const DirChip = ({ dir, small }) => {
        const cfg = {
          BUY: { color: theme.accent, bg: theme.accentDim, label: "▲ BUY" },
          SELL: { color: theme.red, bg: theme.redDim, label: "▼ SELL" },
          NEUTRAL: { color: theme.textSub, bg: "rgba(107,122,153,0.12)", label: "● NEUTRAL" },
        };
        const c = cfg[dir] || cfg.NEUTRAL;
        return (
          <span className="mono" style={{ fontSize: small ? 9 : 10, fontWeight: 600, color: c.color, background: c.bg, padding: small ? "2px 6px" : "3px 8px", borderRadius: 4, letterSpacing: "0.06em" }}>
            {c.label}
          </span>
        );
      };

      // ── Forming Badge ─────────────────────────────────────────────────────────────

      const FormingBadge = () => (
        <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
          <span style={{ width: 6, height: 6, borderRadius: "50%", background: theme.yellow, animation: "pulse-dot 1.4s ease-in-out infinite", display: "inline-block" }} />
          <span className="mono" style={{ fontSize: 9, color: theme.yellow, fontWeight: 600, letterSpacing: "0.08em" }}>
            FORMING
          </span>
        </div>
      );

      // ── Confirmed Badge ───────────────────────────────────────────────────────────

      const ConfirmedBadge = () => (
        <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
          <span style={{ width: 6, height: 6, borderRadius: "50%", background: theme.accent, display: "inline-block" }} />
          <span className="mono" style={{ fontSize: 9, color: theme.accent, fontWeight: 600, letterSpacing: "0.08em" }}>
            CONFIRMED
          </span>
        </div>
      );

      // ── Strength Bar ──────────────────────────────────────────────────────────────

      const StrengthBar = ({ value }) => {
        const color = value >= 75 ? theme.accent : value >= 50 ? theme.yellow : theme.red;
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
              <span style={{ fontSize: 10, color: theme.textSub }}>Formation</span>
              <span className="mono" style={{ fontSize: 10, color, fontWeight: 600 }}>
                {value}%
              </span>
            </div>
            <div style={{ height: 3, background: theme.border, borderRadius: 99, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${value}%`, background: color, borderRadius: 99, transition: "width 0.6s ease" }} />
            </div>
          </div>
        );
      };

      // ── Upcoming Card ─────────────────────────────────────────────────────────────

      const UpcomingCard = ({ item, onClick }) => (
        <div
          className="card-enter"
          onClick={() => onClick(item)}
          style={{
            background: theme.bgCard,
            border: `1px solid ${theme.border}`,
            borderRadius: 14,
            padding: "14px 16px",
            cursor: "pointer",
            transition: "border-color 0.2s, background 0.2s",
            position: "relative",
            overflow: "hidden",
          }}
          onMouseEnter={(e) => {
            e.currentTarget.style.borderColor = theme.borderStrong;
            e.currentTarget.style.background = theme.bgCardHover;
          }}
          onMouseLeave={(e) => {
            e.currentTarget.style.borderColor = theme.border;
            e.currentTarget.style.background = theme.bgCard;
          }}
        >
          <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 2, background: `linear-gradient(90deg, transparent, ${theme.yellow}44, transparent)` }} />
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                <span className="syne" style={{ fontSize: 15, fontWeight: 700, color: theme.text, letterSpacing: "0.02em" }}>
                  {item.pair}
                </span>
                <span className="mono" style={{ fontSize: 10, color: theme.textSub, background: "rgba(255,255,255,0.05)", padding: "2px 6px", borderRadius: 4 }}>
                  {item.tf}
                </span>
              </div>
              <span style={{ fontSize: 12, color: theme.textSub }}>{item.pattern}</span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6 }}>
              <FormingBadge />
              <DirChip dir={item.dir} small />
            </div>
          </div>
          <StrengthBar value={item.strength} />
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 10, alignItems: "center" }}>
            <span style={{ fontSize: 10, color: theme.textMuted }}>forming for</span>
            <span className="mono" style={{ fontSize: 10, color: theme.textSub }}>
              {item.age} min
            </span>
          </div>
        </div>
      );

      // ── Recent Card ───────────────────────────────────────────────────────────────

      const RecentCard = ({ item, onClick }) => (
        <div
          className="card-enter"
          onClick={() => onClick(item)}
          style={{
            background: theme.bgCard,
            border: `1px solid ${theme.border}`,
            borderLeft: `3px solid ${item.dir === "BUY" ? theme.accent : item.dir === "SELL" ? theme.red : theme.textSub}`,
            borderRadius: 14,
            padding: "14px 16px",
            cursor: "pointer",
            transition: "background 0.2s",
          }}
          onMouseEnter={(e) => (e.currentTarget.style.background = theme.bgCardHover)}
          onMouseLeave={(e) => (e.currentTarget.style.background = theme.bgCard)}
        >
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                <span className="syne" style={{ fontSize: 15, fontWeight: 700 }}>
                  {item.pair}
                </span>
                <span className="mono" style={{ fontSize: 10, color: theme.textSub, background: "rgba(255,255,255,0.05)", padding: "2px 6px", borderRadius: 4 }}>
                  {item.tf}
                </span>
              </div>
              <span style={{ fontSize: 12, color: theme.textSub }}>{item.pattern}</span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6 }}>
              <ConfirmedBadge />
              <DirChip dir={item.dir} small />
            </div>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontSize: 10, color: theme.textSub, marginBottom: 3 }}>Confidence</div>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                {[...Array(5)].map((_, i) => (
                  <div key={i} style={{ width: 20, height: 4, borderRadius: 2, background: i < Math.round(item.confidence / 20) ? (item.dir === "BUY" ? theme.accent : theme.red) : theme.border }} />
                ))}
                <span className="mono" style={{ fontSize: 11, color: item.dir === "BUY" ? theme.accent : theme.red, marginLeft: 2, fontWeight: 600 }}>
                  {item.confidence}%
                </span>
              </div>
            </div>
            <span style={{ fontSize: 10, color: theme.textMuted }}>{item.ago}</span>
          </div>
        </div>
      );

      // ── Detail Screen ─────────────────────────────────────────────────────────────

      const DetailScreen = ({ item, credits, onUnlock, onBack }) => {
        const isBuy = item.dir === "BUY";
        const col = isBuy ? theme.accent : item.dir === "SELL" ? theme.red : theme.textSub;
        const entry = isBuy ? 1.0842 : 1.0891;
        const sl = isBuy ? 1.0812 : 1.0921;
        const tp1 = isBuy ? 1.0902 : 1.0831;
        const tp2 = isBuy ? 1.0962 : 1.0771;
        const winProb = item.confidence || item.strength || 72;

        return (
          <div style={{ animation: "fade-in 0.3s ease" }}>
            {/* Header */}
            <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "16px 20px", borderBottom: `1px solid ${theme.border}` }}>
              <button onClick={onBack} style={{ color: theme.textSub, padding: 4 }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <polyline points="15 18 9 12 15 6" />
                </svg>
              </button>
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span className="syne" style={{ fontSize: 17, fontWeight: 700 }}>
                    {item.pair}
                  </span>
                  <span className="mono" style={{ fontSize: 10, color: theme.textSub, background: "rgba(255,255,255,0.05)", padding: "2px 6px", borderRadius: 4 }}>
                    {item.tf}
                  </span>
                  <DirChip dir={item.dir} small />
                </div>
                <span style={{ fontSize: 12, color: theme.textSub }}>{item.pattern}</span>
              </div>
              <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 6, background: theme.accentDim, padding: "6px 12px", borderRadius: 8 }}>
                <Icon name="zap" size={13} color={theme.accent} />
                <span className="mono" style={{ fontSize: 12, color: theme.accent, fontWeight: 600 }}>
                  {credits} cr
                </span>
              </div>
            </div>

            <div style={{ padding: "0 20px", paddingBottom: 20 }}>
              {/* Blurred content behind lock */}
              <div style={{ position: "relative", marginTop: 16 }}>
                {/* Visible: Win probability */}
                <div style={{ background: theme.bgCard, border: `1px solid ${theme.border}`, borderRadius: 14, padding: 16, marginBottom: 12 }}>
                  <div style={{ fontSize: 11, color: theme.textSub, marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.08em" }}>Win Probability</div>
                  <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                    <div style={{ position: "relative", width: 70, height: 70 }}>
                      <svg viewBox="0 0 70 70" style={{ transform: "rotate(-90deg)" }}>
                        <circle cx="35" cy="35" r="28" fill="none" stroke={theme.border} strokeWidth="6" />
                        <circle cx="35" cy="35" r="28" fill="none" stroke={col} strokeWidth="6" strokeDasharray={`${(2 * Math.PI * 28 * winProb) / 100} ${2 * Math.PI * 28}`} strokeLinecap="round" />
                      </svg>
                      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
                        <span className="mono" style={{ fontSize: 14, fontWeight: 700, color: col }}>
                          {winProb}%
                        </span>
                      </div>
                    </div>
                    <div>
                      <div className="syne" style={{ fontSize: 22, fontWeight: 800, color: col }}>
                        {winProb >= 75 ? "Strong" : winProb >= 60 ? "Good" : "Moderate"}
                      </div>
                      <div style={{ fontSize: 12, color: theme.textSub }}>Signal quality</div>
                    </div>
                  </div>
                </div>

                {/* Locked content */}
                <div style={{ position: "relative", borderRadius: 14, overflow: "hidden" }}>
                  {/* Blurred preview */}
                  <div style={{ filter: "blur(6px)", pointerEvents: "none", userSelect: "none" }}>
                    {/* Entry / SL / TP */}
                    <div style={{ background: theme.bgCard, border: `1px solid ${theme.border}`, borderRadius: 14, padding: 16, marginBottom: 12 }}>
                      <div style={{ fontSize: 11, color: theme.textSub, marginBottom: 12, textTransform: "uppercase", letterSpacing: "0.08em" }}>Trade Setup</div>
                      {[
                        { label: "Entry Price", val: entry.toFixed(4), color: theme.text },
                        { label: "Stop Loss", val: sl.toFixed(4), color: theme.red },
                        { label: "Take Profit 1 (1:2)", val: tp1.toFixed(4), color: theme.accent },
                        { label: "Take Profit 2 (1:3)", val: tp2.toFixed(4), color: theme.accent },
                      ].map((r) => (
                        <div key={r.label} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: `1px solid ${theme.border}` }}>
                          <span style={{ fontSize: 12, color: theme.textSub }}>{r.label}</span>
                          <span className="mono" style={{ fontSize: 13, fontWeight: 600, color: r.color }}>
                            {r.val}
                          </span>
                        </div>
                      ))}
                    </div>

                    <div style={{ background: theme.bgCard, border: `1px solid ${theme.border}`, borderRadius: 14, padding: 16, marginBottom: 12 }}>
                      <div style={{ fontSize: 11, color: theme.textSub, marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.08em" }}>Market Context</div>
                      {[
                        ["Trend (Daily)", "Bullish"],
                        ["Volume", "Above avg +18%"],
                        ["RSI (14)", "67.4"],
                        ["ATR", "0.00142"],
                      ].map(([k, v]) => (
                        <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: `1px solid ${theme.border}` }}>
                          <span style={{ fontSize: 12, color: theme.textSub }}>{k}</span>
                          <span className="mono" style={{ fontSize: 12, color: theme.text }}>
                            {v}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Lock overlay */}
                  <div
                    style={{
                      position: "absolute",
                      inset: 0,
                      background: "linear-gradient(to bottom, rgba(8,11,18,0.4) 0%, rgba(8,11,18,0.9) 40%, rgba(8,11,18,0.98) 100%)",
                      display: "flex",
                      flexDirection: "column",
                      alignItems: "center",
                      justifyContent: "center",
                      padding: 24,
                      borderRadius: 14,
                    }}
                  >
                    <div style={{ width: 52, height: 52, borderRadius: 16, background: theme.accentDim, border: `1px solid ${theme.accent}33`, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 14 }}>
                      <Icon name="lock" size={22} color={theme.accent} />
                    </div>
                    <div className="syne" style={{ fontSize: 17, fontWeight: 700, marginBottom: 6, textAlign: "center" }}>
                      Premium Analysis
                    </div>
                    <div style={{ fontSize: 12, color: theme.textSub, textAlign: "center", marginBottom: 24, lineHeight: 1.6 }}>Unlock full trade setup, entry/exit levels, and market context</div>
                    <button
                      onClick={() => onUnlock(item)}
                      style={{
                        background: `linear-gradient(135deg, ${theme.accent}, #00C87A)`,
                        color: "#060A0F",
                        fontFamily: "'Syne', sans-serif",
                        fontWeight: 700,
                        fontSize: 14,
                        padding: "14px 32px",
                        borderRadius: 12,
                        width: "100%",
                        letterSpacing: "0.02em",
                        animation: "glow-pulse 2s ease-in-out infinite",
                      }}
                    >
                      Unlock for 5 Credits
                    </button>
                    <div style={{ marginTop: 12, fontSize: 11, color: theme.textMuted }}>
                      Balance:{" "}
                      <span className="mono" style={{ color: theme.accent }}>
                        {credits} credits
                      </span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      // ── Wallet Screen ─────────────────────────────────────────────────────────────

      const WalletScreen = ({ credits, onBuy }) => {
        const packages = [
          { id: 1, price: "$1", credits: 100, bonus: "", highlight: false },
          { id: 2, price: "$5", credits: 600, bonus: "+100 bonus", highlight: false },
          { id: 3, price: "$10", credits: 1300, bonus: "+300 bonus", highlight: true, badge: "BEST VALUE" },
        ];

        return (
          <div style={{ padding: "0 20px 100px", animation: "fade-in 0.3s ease" }}>
            {/* Balance */}
            <div style={{ background: `linear-gradient(135deg, #0A1628, #0D1F3C)`, border: `1px solid ${theme.border}`, borderRadius: 18, padding: 24, marginBottom: 24, position: "relative", overflow: "hidden" }}>
              <div style={{ position: "absolute", top: -30, right: -30, width: 100, height: 100, borderRadius: "50%", background: theme.accentDim, filter: "blur(30px)" }} />
              <div style={{ fontSize: 12, color: theme.textSub, marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.08em" }}>Credit Balance</div>
              <div className="syne" style={{ fontSize: 42, fontWeight: 800, color: theme.accent, marginBottom: 4 }}>
                {credits}
              </div>
              <div style={{ fontSize: 13, color: theme.textSub }}>≈ {Math.floor(credits / 5)} signals remaining</div>
              <div style={{ marginTop: 16, display: "flex", gap: 16 }}>
                {[
                  ["Signals Unlocked", "24"],
                  ["Credits Used", "120"],
                ].map(([l, v]) => (
                  <div key={l}>
                    <div className="mono" style={{ fontSize: 16, fontWeight: 600, color: theme.text }}>
                      {v}
                    </div>
                    <div style={{ fontSize: 10, color: theme.textMuted }}>{l}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Packages */}
            <div className="syne" style={{ fontSize: 13, fontWeight: 600, color: theme.textSub, marginBottom: 14, letterSpacing: "0.06em", textTransform: "uppercase" }}>
              Buy Credits
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {packages.map((pkg) => (
                <div
                  key={pkg.id}
                  style={{
                    background: pkg.highlight ? `linear-gradient(135deg, rgba(0,229,160,0.08), rgba(0,229,160,0.03))` : theme.bgCard,
                    border: `1px solid ${pkg.highlight ? theme.accent + "44" : theme.border}`,
                    borderRadius: 14,
                    padding: "16px 18px",
                    position: "relative",
                    overflow: "hidden",
                  }}
                >
                  {pkg.badge && <div style={{ position: "absolute", top: 12, right: 12, background: theme.accent, color: "#060A0F", fontSize: 8, fontWeight: 800, padding: "3px 8px", borderRadius: 4, letterSpacing: "0.08em", fontFamily: "'DM Mono', monospace" }}>{pkg.badge}</div>}
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <div>
                      <div className="syne" style={{ fontSize: 24, fontWeight: 800, color: pkg.highlight ? theme.accent : theme.text }}>
                        {pkg.price}
                      </div>
                      <div style={{ fontSize: 12, color: theme.textSub, marginTop: 2 }}>
                        <span className="mono" style={{ color: theme.text, fontWeight: 600 }}>
                          {pkg.credits.toLocaleString()} credits
                        </span>
                        {pkg.bonus && <span style={{ color: theme.accent, marginLeft: 6 }}>{pkg.bonus}</span>}
                      </div>
                    </div>
                    <button
                      onClick={() => onBuy(pkg)}
                      style={{
                        background: pkg.highlight ? `linear-gradient(135deg, ${theme.accent}, #00C87A)` : "rgba(255,255,255,0.06)",
                        color: pkg.highlight ? "#060A0F" : theme.text,
                        fontFamily: "'Syne', sans-serif",
                        fontWeight: 700,
                        fontSize: 13,
                        padding: "10px 20px",
                        borderRadius: 10,
                        letterSpacing: "0.02em",
                        border: pkg.highlight ? "none" : `1px solid ${theme.border}`,
                      }}
                    >
                      Buy Now
                    </button>
                  </div>
                </div>
              ))}
            </div>

            {/* Payment methods */}
            <div style={{ marginTop: 20, padding: 16, background: theme.bgCard, border: `1px solid ${theme.border}`, borderRadius: 14 }}>
              <div style={{ fontSize: 11, color: theme.textMuted, marginBottom: 12, textAlign: "center" }}>Secure Payment via</div>
              <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
                {["Stripe", "Google Pay", "Apple Pay"].map((m) => (
                  <div key={m} style={{ background: "rgba(255,255,255,0.04)", border: `1px solid ${theme.border}`, borderRadius: 8, padding: "6px 14px" }}>
                    <span style={{ fontSize: 11, color: theme.textSub, fontWeight: 500 }}>{m}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      };

      // ── Notifications Screen ──────────────────────────────────────────────────────

      const NotificationsScreen = ({ items, onMark }) => {
        const unreadCount = items.filter((n) => !n.read).length;
        return (
          <div style={{ padding: "0 20px 100px", animation: "fade-in 0.3s ease" }}>
            {unreadCount > 0 && (
              <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 12 }}>
                <button onClick={onMark} style={{ fontSize: 12, color: theme.accent, fontWeight: 500 }}>
                  Mark all read
                </button>
              </div>
            )}
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {items.map((n, i) => (
                <div
                  key={n.id}
                  className="card-enter"
                  style={{
                    background: n.read ? theme.bgCard : "rgba(14,20,32,0.95)",
                    border: `1px solid ${n.read ? theme.border : theme.borderStrong}`,
                    borderRadius: 14,
                    padding: "14px 16px",
                    display: "flex",
                    gap: 14,
                    alignItems: "flex-start",
                    animationDelay: `${i * 0.05}s`,
                    opacity: 0,
                  }}
                >
                  <div
                    style={{
                      width: 38,
                      height: 38,
                      borderRadius: 10,
                      background: n.dir === "BUY" ? theme.accentDim : n.dir === "SELL" ? theme.redDim : "rgba(255,255,255,0.04)",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      flexShrink: 0,
                    }}
                  >
                    <Icon name={n.dir === "BUY" ? "arrowUp" : n.dir === "SELL" ? "arrowDown" : "star"} size={16} color={n.dir === "BUY" ? theme.accent : n.dir === "SELL" ? theme.red : theme.textSub} />
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                      <div>
                        <div style={{ fontSize: 13, fontWeight: 600, color: n.read ? theme.textSub : theme.text, marginBottom: 2 }}>
                          {n.pair} {n.tf}
                        </div>
                        <div style={{ fontSize: 12, color: theme.textSub }}>{n.event}</div>
                      </div>
                      <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>
                        <span style={{ fontSize: 10, color: theme.textMuted }}>{n.time}</span>
                        {!n.read && <span style={{ width: 7, height: 7, borderRadius: "50%", background: theme.accent, display: "block" }} />}
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      // ── Profile Screen ────────────────────────────────────────────────────────────

      const ProfileScreen = ({ credits }) => {
        const [notif, setNotif] = useState(true);
        const [tz, setTz] = useState("UTC+0");

        return (
          <div style={{ padding: "0 20px 100px", animation: "fade-in 0.3s ease" }}>
            {/* Avatar */}
            <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 24, padding: 20, background: theme.bgCard, border: `1px solid ${theme.border}`, borderRadius: 18 }}>
              <div style={{ width: 56, height: 56, borderRadius: 16, background: `linear-gradient(135deg, ${theme.accent}, ${theme.blue})`, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <Icon name="user" size={24} color="#060A0F" />
              </div>
              <div>
                <div className="syne" style={{ fontSize: 17, fontWeight: 700 }}>
                  Trader Pro
                </div>
                <div style={{ fontSize: 12, color: theme.textSub }}>trader@example.com</div>
                <div style={{ marginTop: 5, display: "inline-flex", alignItems: "center", gap: 5, background: theme.accentDim, padding: "3px 10px", borderRadius: 6 }}>
                  <Icon name="shield" size={10} color={theme.accent} />
                  <span style={{ fontSize: 10, color: theme.accent, fontWeight: 600 }}>FREE PLAN</span>
                </div>
              </div>
              <div style={{ marginLeft: "auto", textAlign: "right" }}>
                <div className="mono" style={{ fontSize: 20, fontWeight: 700, color: theme.accent }}>
                  {credits}
                </div>
                <div style={{ fontSize: 10, color: theme.textMuted }}>credits</div>
              </div>
            </div>

            {/* Stats */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 20 }}>
              {[
                ["Signals", "38", theme.accent],
                ["Unlocked", "24", theme.blue],
                ["Cr. Used", "120", theme.yellow],
              ].map(([l, v, c]) => (
                <div key={l} style={{ background: theme.bgCard, border: `1px solid ${theme.border}`, borderRadius: 12, padding: "14px 10px", textAlign: "center" }}>
                  <div className="mono" style={{ fontSize: 20, fontWeight: 700, color: c }}>
                    {v}
                  </div>
                  <div style={{ fontSize: 10, color: theme.textMuted, marginTop: 3 }}>{l}</div>
                </div>
              ))}
            </div>

            {/* Settings */}
            <div className="syne" style={{ fontSize: 12, fontWeight: 600, color: theme.textMuted, marginBottom: 10, letterSpacing: "0.08em", textTransform: "uppercase" }}>
              Settings
            </div>
            <div style={{ background: theme.bgCard, border: `1px solid ${theme.border}`, borderRadius: 14, overflow: "hidden" }}>
              {[
                {
                  label: "Notifications",
                  icon: "bell",
                  right: (
                    <button onClick={() => setNotif((p) => !p)} style={{ width: 42, height: 24, borderRadius: 12, background: notif ? theme.accent : theme.border, position: "relative", transition: "background 0.25s" }}>
                      <div style={{ position: "absolute", top: 3, left: notif ? 21 : 3, width: 18, height: 18, borderRadius: "50%", background: "#fff", transition: "left 0.25s" }} />
                    </button>
                  ),
                },
                {
                  label: "Timezone",
                  icon: "clock",
                  right: (
                    <span className="mono" style={{ fontSize: 12, color: theme.textSub }}>
                      {tz}
                    </span>
                  ),
                },
                { label: "Symbol Prefs", icon: "star", right: <span style={{ fontSize: 12, color: theme.textSub }}>All markets</span> },
                { label: "Subscription", icon: "zap", right: <span style={{ fontSize: 12, color: theme.accent, fontWeight: 600 }}>Upgrade →</span> },
              ].map((row, i, arr) => (
                <div
                  key={row.label}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "space-between",
                    padding: "14px 16px",
                    borderBottom: i < arr.length - 1 ? `1px solid ${theme.border}` : "none",
                  }}
                >
                  <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <Icon name={row.icon} size={16} color={theme.textSub} />
                    <span style={{ fontSize: 14, color: theme.text }}>{row.label}</span>
                  </div>
                  {row.right}
                </div>
              ))}
            </div>
          </div>
        );
      };

      // ── Main App ──────────────────────────────────────────────────────────────────

      function App() {
        const [activeTab, setActiveTab] = useState(0);
        const [detail, setDetail] = useState(null);
        const [credits, setCredits] = useState(250);
        const [notifications, setNotifications] = useState(notificationsData);
        const [now, setNow] = useState(new Date());

        useEffect(() => {
          const t = setInterval(() => setNow(new Date()), 1000);
          return () => clearInterval(t);
        }, []);

        const tabs = [
          { label: "Upcoming", icon: "calendar" },
          { label: "Recent", icon: "clock" },
          { label: "Wallet", icon: "wallet" },
          { label: "Alerts", icon: "bell" },
          { label: "Profile", icon: "user" },
        ];

        const unread = notifications.filter((n) => !n.read).length;

        const handleUnlock = (item) => {
          if (credits >= 5) {
            setCredits((c) => c - 5);
            alert(`✅ Analysis unlocked for ${item.pair} ${item.tf}!\n5 credits deducted. Balance: ${credits - 5} credits`);
          } else {
            alert("❌ Insufficient credits. Please top up your wallet.");
          }
        };

        const handleBuy = (pkg) => {
          setCredits((c) => c + pkg.credits);
          alert(`✅ ${pkg.credits} credits added! New balance: ${credits + pkg.credits}`);
        };

        const screenTitle = detail ? null : ["Upcoming Events", "Recent Events", "Wallet", "Notifications", "Profile"][activeTab];

        return (
          <>
            <style>{css}</style>

            {/* Phone shell */}
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh", background: "#030508", padding: 20 }}>
              <div
                style={{
                  width: 390,
                  minHeight: 844,
                  maxHeight: "92vh",
                  background: theme.bg,
                  borderRadius: 44,
                  border: "1px solid rgba(255,255,255,0.08)",
                  overflow: "hidden",
                  display: "flex",
                  flexDirection: "column",
                  boxShadow: "0 40px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.04), inset 0 0 0 1px rgba(255,255,255,0.03)",
                  position: "relative",
                }}
              >
                {/* Status bar */}
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 24px 8px", flexShrink: 0 }}>
                  <span className="mono" style={{ fontSize: 12, fontWeight: 600, color: theme.text }}>
                    {now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
                  </span>
                  <div style={{ width: 110, height: 28, background: "#000", borderRadius: 20, display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <div style={{ width: 10, height: 10, borderRadius: "50%", background: "#333" }} />
                  </div>
                  <div style={{ display: "flex", gap: 5, alignItems: "center" }}>
                    <div style={{ display: "flex", gap: 1.5, alignItems: "flex-end" }}>
                      {[3, 5, 7, 9].map((h, i) => (
                        <div key={i} style={{ width: 3, height: h, background: theme.text, borderRadius: 1 }} />
                      ))}
                    </div>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill={theme.text}>
                      <path d="M1 6s4.5-4 11-4 11 4 11 4M5 10s3-3 7-3 7 3 7 3M9 14s1-1 3-1 3 1 3 1M11 18h2v2h-2z" />
                    </svg>
                    <div style={{ display: "flex", alignItems: "center", gap: 2, background: theme.bgCard, borderRadius: 4, padding: "2px 5px" }}>
                      <div style={{ height: 9, background: theme.accent, borderRadius: 1, width: 14 }} />
                      <div style={{ width: 3, height: 6, background: theme.accent, borderRadius: 1 }} />
                    </div>
                  </div>
                </div>

                {/* Ticker */}
                <div style={{ flexShrink: 0 }}>
                  <TickerBar />
                </div>

                {/* Header */}
                {!detail && (
                  <div style={{ padding: "12px 20px 10px", flexShrink: 0, borderBottom: `1px solid ${theme.border}` }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div>
                        <div className="syne" style={{ fontSize: 11, fontWeight: 600, color: theme.textMuted, letterSpacing: "0.1em", textTransform: "uppercase" }}>
                          Market Signal Hub
                        </div>
                        <div className="syne" style={{ fontSize: 20, fontWeight: 800 }}>
                          {screenTitle}
                        </div>
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 5, background: theme.accentDim, padding: "6px 12px", borderRadius: 8 }}>
                          <Icon name="zap" size={13} color={theme.accent} />
                          <span className="mono" style={{ fontSize: 12, fontWeight: 700, color: theme.accent }}>
                            {credits}
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* Content */}
                <div style={{ flex: 1, overflowY: "auto", paddingTop: detail ? 0 : 16 }}>
                  {detail ? (
                    <DetailScreen item={detail} credits={credits} onUnlock={handleUnlock} onBack={() => setDetail(null)} />
                  ) : activeTab === 0 ? (
                    <div style={{ padding: "0 20px 100px", display: "flex", flexDirection: "column", gap: 10 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                        <span style={{ fontSize: 12, color: theme.textMuted }}>{upcomingData.length} signals forming</span>
                        <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                          <span style={{ width: 6, height: 6, borderRadius: "50%", background: theme.accent, display: "inline-block", animation: "pulse-dot 1.2s ease-in-out infinite" }} />
                          <span style={{ fontSize: 11, color: theme.accent }}>Live</span>
                        </div>
                      </div>
                      {upcomingData.map((item) => (
                        <UpcomingCard key={item.id} item={item} onClick={setDetail} />
                      ))}
                    </div>
                  ) : activeTab === 1 ? (
                    <div style={{ padding: "0 20px 100px", display: "flex", flexDirection: "column", gap: 10 }}>
                      <span style={{ fontSize: 12, color: theme.textMuted, marginBottom: 4 }}>{recentData.length} confirmed signals today</span>
                      {recentData.map((item) => (
                        <RecentCard key={item.id} item={item} onClick={setDetail} />
                      ))}
                    </div>
                  ) : activeTab === 2 ? (
                    <WalletScreen credits={credits} onBuy={handleBuy} />
                  ) : activeTab === 3 ? (
                    <NotificationsScreen items={notifications} onMark={() => setNotifications((n) => n.map((x) => ({ ...x, read: true })))} />
                  ) : (
                    <ProfileScreen credits={credits} />
                  )}
                </div>

                {/* Bottom Nav */}
                {!detail && (
                  <div
                    style={{
                      position: "sticky",
                      bottom: 0,
                      background: "rgba(8,11,18,0.95)",
                      backdropFilter: "blur(16px)",
                      borderTop: `1px solid ${theme.border}`,
                      padding: "8px 8px 20px",
                      display: "flex",
                      flexShrink: 0,
                    }}
                  >
                    {tabs.map((tab, i) => {
                      const active = activeTab === i;
                      return (
                        <button
                          key={i}
                          onClick={() => {
                            setActiveTab(i);
                            setDetail(null);
                          }}
                          style={{
                            flex: 1,
                            display: "flex",
                            flexDirection: "column",
                            alignItems: "center",
                            gap: 4,
                            padding: "8px 4px",
                            borderRadius: 12,
                            background: active ? theme.accentDim : "transparent",
                            transition: "background 0.2s",
                            position: "relative",
                          }}
                        >
                          {i === 3 && unread > 0 && (
                            <div
                              style={{
                                position: "absolute",
                                top: 4,
                                right: "28%",
                                width: 14,
                                height: 14,
                                borderRadius: "50%",
                                background: theme.red,
                                border: `2px solid ${theme.bg}`,
                                display: "flex",
                                alignItems: "center",
                                justifyContent: "center",
                              }}
                            >
                              <span className="mono" style={{ fontSize: 7, fontWeight: 800, color: "#fff" }}>
                                {unread}
                              </span>
                            </div>
                          )}
                          <Icon name={tab.icon} size={20} color={active ? theme.accent : theme.textMuted} />
                          <span style={{ fontSize: 9, fontWeight: active ? 700 : 400, color: active ? theme.accent : theme.textMuted, fontFamily: "'DM Sans', sans-serif", letterSpacing: "0.02em" }}>{tab.label}</span>
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          </>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
